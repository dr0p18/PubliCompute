// Shared types used in enrollment, work assignments, and status messages.
// Money uses integer millionths of a currency unit. Hashes travel as raw bytes,
// so a SHA-256 field carries 32 bytes.
syntax = "proto3";

package publicompute.common.v1;

option go_package = "publicompute/proto/gen/go/publicompute/common/v1;commonv1";

// Trust tiers are ordered by what data a node can handle. A node can also
// receive work that requires a lower tier.
enum TrustTier {
  TRUST_TIER_UNSPECIFIED = 0;
  // Base tier for single-node work on non-personal data.
  TRUST_TIER_BASE = 1;
  // The node can prove its boot state with a TPM quote.
  TRUST_TIER_ATTESTED = 2;
  // Eligible for verification samples.
  TRUST_TIER_VERIFIER = 3;
}

enum EngineKind {
  ENGINE_KIND_UNSPECIFIED = 0;
  ENGINE_KIND_LLAMA_CPP = 1;
  ENGINE_KIND_DWARFSTAR = 2;
}

// Actual admission to a physical slot. Generations increase within the chain epoch.
message SlotTaken {
  uint32 slot = 1;
  uint64 generation = 2;
}

// The head's terminal slot state. The generation fences reports arriving out of order.
message SlotReport {
  uint32 slot = 1;
  uint64 generation = 2;
  bool parked = 3;
}

// Identifies the exact weight file used for inference and verification. The
// verifier needs the same weights to compare token probabilities.
message ModelRef {
  // Catalog identifier.
  string model_id = 1;
  // Encoding of the stored weights, such as Q4_K_M.
  string quantization = 2;
  // SHA-256 of the weight file or of the manifest for a multi-file artifact.
  // Use this fingerprint to verify the downloaded bytes.
  bytes weights_sha256 = 3;
}

// Half-open range of layers assigned to a pipeline stage.
message LayerRange {
  uint32 first = 1;
  uint32 last = 2;
}

message Money {
  int64 micros = 1;
  string currency = 2;
}

message ProtocolVersion {
  // Increment when message semantics break interoperability.
  uint32 major = 1;
  // Increment for compatible additions to the protocol.
  uint32 minor = 2;
}

message Error {
  ErrorCode code = 1;
  // Intended for diagnostic logs.
  string message = 2;
  // Sequence number of the request that caused the error, when known.
  uint64 in_reply_to_seq = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED_PROTOCOL = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_BANNED = 3;
  ERROR_CODE_INVALID_MESSAGE = 4;
  ERROR_CODE_UNKNOWN_LEASE = 5;
  ERROR_CODE_LEASE_EXPIRED = 6;
  ERROR_CODE_AGENT_TOO_OLD = 7;
  ERROR_CODE_RATE_LIMITED = 8;
  ERROR_CODE_INTERNAL = 9;
}
