[package]
name = "publicompute"
version = "0.1.7"
description = "Command-line client for the PubliCompute agent"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "publicompute"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
crossterm = "0.28"
unicode-width = "0.1"
rustix = { version = "1.1", features = ["event", "fs", "net", "process", "termios"] }
getrandom = "0.4"
httpdate = "1"
signal-hook = "0.3"
ureq = { version = "3.5.2", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3"
