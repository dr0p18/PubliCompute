[package]
name = "publicompute-stage"
version = "0.1.7"
description = "Runs one layer range in a distributed inference chain"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["llama"]
# Disable the default feature to build the scheduler, wire types, and other engine-independent modules without linking native libraries.
llama = ["dep:publicompute-llama-sys"]

[dependencies]
publicompute-proto = { path = "../proto/rust" }
publicompute-llama-sys = { path = "llama-sys", optional = true }
prost.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
ring = "0.17.14"
zeroize = "1"

[dev-dependencies]
rcgen = "0.14.7"
tempfile = "3"
